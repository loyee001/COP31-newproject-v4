<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" data-i18n-content="ShadePath：可验证的校园太阳几何、贪心种植优化与 UTCI 计算实验。合成数据，模型输出，非实测。" content="ShadePath：可验证的校园太阳几何、贪心种植优化与 UTCI 计算实验。合成数据，模型输出，非实测。">
  <title>绿茵计划 ShadePath · 算法实验室</title>

<body>
<div class="app-layout"><div class="sidebar-shell"><aside class="global-sidebar controls"><section class="sidebar-sun"><h2 data-i18n="太阳控制"></h2><label class="control-label" for="clock"><span data-i18n="模拟时刻"></span><output id="clock-value">12:20</output></label><input id="clock" type="range" min="0" max="1439" step="1" value="740" aria-valuetext="12:20"><div class="range-labels"><span>00:00</span><span>12:00</span><span>23:59</span></div><div class="sun-presets" role="group" data-i18n-aria="选择时段" aria-label="选择时段"><button type="button" data-solar-time="540">09:00</button><button type="button" data-solar-time="720">12:00</button><button type="button" data-solar-time="900">15:00</button></div><div id="sidebar-solar-position" class="sidebar-solar-position"></div><p id="sidebar-sun-status" class="small muted"></p></section>
<section class="sidebar-budget"><label class="control-label" for="budget"><span data-i18n="总预算"></span><output id="budget-value">$2,200</output></label><input id="budget" type="range" min="0" max="5000" step="50" value="2200"><div class="range-labels"><span>$0</span><span id="budget-maximum">$5,000</span></div><div id="budget-brief"></div><div id="over-budget" class="alert" hidden></div></section>
<section class="sidebar-comparison"><h2 data-i18n="遮阳效果对比"></h2><p id="comparison-conditions" class="small muted"></p><div id="comparison-table"></div><div id="comparison-summary"></div><p class="small muted" data-i18n="优化前含原有遮荫。"></p></section>
<details class="sidebar-more"><summary data-i18n="更多选项"></summary><div class="segmented"><button id="auto-mode" data-i18n="自动优化" aria-pressed="true"></button><button id="manual-mode" data-i18n="手动种植" aria-pressed="false"></button></div><div id="budget-summary"></div><p class="small muted" data-i18n="每棵 $95，含三年养护；合成示例价格。"></p><div class="near-plan"><strong data-i18n="保留 91% 收益"></strong><p id="near-summary" class="small"></p><p class="small muted" data-i18n="近似保留 91% 的满预算新增遮荫收益，不代表全局最优。"></p><button id="apply-near" class="button" data-i18n="应用节省方案"></button></div><div class="button-row"><button id="undo-tree" class="button subtle" data-i18n="撤销上一棵"></button><button id="clear-trees" class="button subtle" data-i18n="清空新增树"></button></div><p class="small muted" data-i18n="点击空地种树，点击新增树移除。"></p></details></aside><div id="sidebar-resizer" role="separator" tabindex="0" aria-orientation="vertical" data-i18n-aria="拖动调整侧栏宽度，最大 50%" aria-label="拖动调整侧栏宽度，最大 50%"></div></div><div class="content-shell">
<header class="topbar"><a class="brand" href="#overview" aria-label="ShadePath"><span class="brand-icon">⌁</span><span>ShadePath<small data-i18n="绿茵计划"></small></span></a><div class="header-right"><span class="local-label" data-i18n="本地运行 · 无外部依赖"></span><select id="language" aria-label="Language"><option value="zh">简体中文</option><option value="en">English</option><option value="tr">Türkçe</option></select></div></header>
<nav class="tabs" data-i18n-aria="页面导航" aria-label="页面导航"><a href="#overview" data-view="overview"><span>01</span><span data-i18n="概览"></span></a><a href="#budget" data-view="budget"><span>02</span><span data-i18n="路线与预算"></span></a><a href="#sun" data-view="sun"><span>03</span><span data-i18n="太阳与阴影"></span></a><a href="#method" data-view="method"><span>04</span><span data-i18n="方法学"></span></a></nav>
<main>
<section id="view-overview" class="view">
  <div class="intro"><div><p class="eyebrow">SHADEPATH / <span data-i18n="气候适应实验室"></span></p><h1 data-i18n="校园荫凉规划实验室"></h1><p class="lead" data-i18n="导入校园步道网络，用太阳几何和贪心优化，找到每一棵树的位置。"></p></div><a class="button primary" href="#budget"><span data-i18n="开始规划"></span> ↗</a></div>
  <div class="notice"><span class="status-dot"></span><span data-campus-provenance></span><span class="notice-right" data-i18n="本地计算，不调用外部 AI 或天气服务。"></span></div>
  <div class="overview-grid"><article class="panel map-panel"><div class="panel-head"><div><span class="eyebrow">01 / <span data-i18n="校园几何"></span></span><h2 data-i18n="一条路线，一次微改变"></h2></div><span class="pill" data-campus-length></span></div><div class="map-toolbar" data-map-controls="overview"></div><div id="overview-map" class="map" data-map="overview"></div><div class="legend" data-legend></div><p class="shade-map-caption small muted" data-i18n="阴影为选定时刻；路线颜色按各点抵达时刻计算。"></p></article><div class="overview-side"><div class="section-label" data-i18n="方案对比"></div><div id="overview-metrics" class="metric-stack"></div><a href="#sun" class="text-link"><span data-i18n="探索太阳轨迹"></span> →</a><p class="small muted" data-i18n="文档参考数值依赖原始几何，本示例不将其作为固定结果。"></p></div></div>
</section>
<section id="view-budget" class="view" hidden>
  <div class="intro compact"><div><p class="eyebrow">02 / <span data-i18n="加权贪心优化"></span></p><h1 data-i18n="路线与预算"></h1><p class="lead" data-i18n="按所选时刻优化，树位随太阳变化。"></p></div><button class="button" data-export data-i18n="导出 campus.json"></button></div>
  <div class="workspace budget-workspace"><article class="panel map-panel"><div class="panel-head"><h2 data-i18n="路线遮阳"></h2><span id="plan-mode" class="pill"></span></div><div class="map-toolbar" data-map-controls="budget"></div><div id="budget-map" class="map" data-map="budget"></div><div class="network-summary" data-network-summary></div><div class="legend" data-legend></div><p class="shade-map-caption small muted" data-i18n="阴影为选定时刻；路线颜色按各点抵达时刻计算。"></p></article></div>
  <div class="two-columns"><article class="panel"><div class="panel-head"><h2 data-i18n="预算与收益"></h2><span class="muted small" data-i18n="当前时段新增荫凉（分钟）"></span></div><div id="gain-chart" class="chart"></div><p class="small muted" data-i18n="贪心算法不保证全局最优；91% 方案取收益序列中满足保留比例的最短前缀。"></p></article><article class="panel"><div class="panel-head"><h2 data-i18n="钱花在哪里"></h2><span id="tree-count" class="pill"></span></div><p class="small muted" data-i18n="点击清单定位到地图中的树。"></p><div id="tree-list" class="tree-list"></div></article></div>
  <article class="panel audit-panel"><div class="panel-head"><h2 data-i18n="种植坐标与优化选择"></h2><button class="button subtle" data-report data-i18n="导出计算报告"></button></div><div id="optimizer-audit"></div></article>
</section>
<section id="view-sun" class="view" hidden>
  <div class="intro compact"><div><p class="eyebrow">03 / <span data-i18n="太阳几何与 UTCI"></span></p><h1 data-i18n="太阳与阴影"></h1><p class="lead" data-i18n="同一条路，在不同季节和时刻重新计算。"></p></div><button id="reset-settings" class="button" data-i18n="重置日期"></button></div>
  <div id="campus-original-map" hidden></div>
  <div class="panel campus-settings"><div class="campus-name-field"><label for="campus-name" data-i18n="校园名称"></label><div class="campus-name-input"><input id="campus-name" type="text" maxlength="160" placeholder="学校全名 + 城市" autocomplete="off"><button type="button" id="locate-campus" class="button" data-i18n="定位校园"></button></div><p id="campus-location-status" class="small muted" role="status"></p><select id="campus-location-options" aria-label="选择校园地址" hidden></select><a class="location-attribution small muted" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">© OpenStreetMap</a></div><div class="field"><label for="date" data-i18n="模拟日期"></label><input id="date" type="date" value="2026-06-21" min="1900-01-01" max="2100-12-31"></div></div>
  <div id="campus-import-controls"></div>
  <div class="workspace sun-workspace"><div><article class="panel map-panel"><div class="panel-head"><h2 data-i18n="阴影投影"></h2><div id="solar-position" class="solar-position"></div></div><div class="map-toolbar" data-map-controls="sun"></div><div id="recognition-toolbar"></div><div id="sun-map" class="map" data-map="sun"></div><div class="legend" data-legend></div><p class="shade-map-caption small muted" data-i18n="阴影为选定时刻；路线颜色按各点抵达时刻计算。"></p><div id="night-warning" class="alert" hidden data-i18n="日落后无直射日光，遮荫收益不适用。"></div><div id="sun-metrics" class="map-metrics"></div></article><article class="panel network-results"><div class="panel-head"><h2 data-i18n="全路网遮荫对比"></h2></div><div class="network-summary" data-network-summary></div><div id="network-table"></div><p class="small muted" data-i18n="公共树可服务多条步道，费用只计算一次；重叠路段不重复计分。"></p></article><details class="panel thermal-panel"><summary data-i18n="UTCI 估算详情"></summary><div class="panel-head"><h2 data-i18n="官方 UTCI 近似"></h2><span class="pill" data-i18n="六阶多项式"></span></div><div id="thermal-detail"></div><p class="small muted" data-i18n="UTCI 使用官方近似算法；天气与辐射输入为合成估计，不能替代实测。"></p></details></div></div>
  <article class="panel"><div class="panel-head"><h2 data-i18n="全天路线遮荫率"></h2><div class="chart-key"><span class="before" data-i18n="种植前"></span><span class="after" data-i18n="种植后"></span></div></div><div id="day-chart" class="chart"></div><p class="small muted" data-i18n="自动模式下各时段分别优化；手动模式下保持同一方案。"></p></article>
</section>
<section id="view-method" class="view" hidden><div class="intro compact"><div><p class="eyebrow">04 / <span data-i18n="开放方法"></span></p><h1 data-i18n="方法学"></h1><p class="lead" data-i18n="每一个结果，都可以回到一条公式。"></p></div><button class="button" data-report data-i18n="导出计算报告"></button></div><div id="method-cards" class="method-grid"></div><article class="panel limits"><h2 data-i18n="已知局限"></h2><ul><li data-i18n="天气、人流与校园布局均为合成数据。"></li><li data-i18n="未模拟树冠生长、蒸腾、地表反射或局地风场。"></li><li data-i18n="未接入天气预报、传感器或真实校园测绘。"></li><li data-i18n="预算收益来自确定性算法，本版本未接入 AI 模型。"></li><li data-i18n="文档参考数值依赖原始几何，本示例不将其作为固定结果。"></li></ul><h3 data-i18n="接入真实校园"></h3><p data-i18n="替换建筑轮廓与高度、树冠和路线，再用现场测量校准。"></p></article></section>
</main><footer><span>ShadePath <span class="muted">/</span> <span data-i18n="校园荫凉规划实验室"></span></span><span data-i18n="模型输出，非实测"></span></footer></div><aside id="campus-scene-sidebar" class="scene-sidebar" aria-label="校园 3D 场景"></aside></div><div id="toast" class="toast" role="status" aria-live="polite"></div><div id="busy" class="busy" hidden><span class="status-dot"></span><span data-i18n="方案已更新"></span></div>
